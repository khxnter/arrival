---
layout: default
title: ARRIVAL | Games
---
<div class="container">

  <h3>Games Completed</h3>

<div class="games" id="pc-games">
  <div class="row header">
    <div class="cell year">Year</div>
    <div class="cell game">PC Games</div>
    <div class="cell hours">Hours</div>
    <div class="cell month">Month</div>
    <div class="cell note">Notes</div>
  </div>
  <div class="row loading">
    <div class="cell year"></div>
    <div class="cell game">Loading...</div>
    <div class="cell hours"></div>
    <div class="cell month"></div>
    <div class="cell note"></div>
  </div>
</div>

<div class="games" id="xbox-games">
  <div class="row header">
    <div class="cell year">Year</div>
    <div class="cell game">XBOX Games</div>
    <div class="cell hours">Hours</div>
    <div class="cell month">Month</div>
    <div class="cell note">Notes</div>
  </div>
  <div class="row loading">
    <div class="cell year"></div>
    <div class="cell game">Loading...</div>
    <div class="cell hours"></div>
    <div class="cell month"></div>
    <div class="cell note"></div>
  </div>
</div>

</div>

<script>
(function () {
  // Google Sheets: File > Share > Publish to web > Games Completed > CSV
  var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTlOhBrk_SZ4vop6Rx6jpeitEeiJ76uVKOYnsoU1PGKZF_pINkKcfdBbxKwdZwgtw/pub?gid=1187487172&single=true&output=csv";

  // Sheet platform values mapped to page container IDs
  var CONTAINERS = {
    "PC": "pc-games",
    "Xbox": "xbox-games"
  };

  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;

    for (var i = 0; i < text.length; i++) {
      var c = text[i];

      if (inQuotes) {
        if (c === '"' && text[i + 1] === '"') {
          field += '"';
          i++;
        } else if (c === '"') {
          inQuotes = false;
        } else {
          field += c;
        }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ",") {
        row.push(field);
        field = "";
      } else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field);
        field = "";
        rows.push(row);
        row = [];
      } else {
        field += c;
      }
    }

    if (field !== "" || row.length) {
      row.push(field);
      rows.push(row);
    }

    return rows;
  }

  function el(tag, cls, text) {
    var d = document.createElement(tag);
    d.className = cls;

    if (text !== undefined && text !== null) {
      d.textContent = text;
    }

    return d;
  }

  function makeRow(cls, year, game, hours, month, note) {
    var r = el("div", cls ? "row " + cls : "row");

    r.appendChild(el("div", "cell year", year));
    r.appendChild(el("div", "cell game", game));
    r.appendChild(el("div", "cell hours", hours));
    r.appendChild(el("div", "cell month", month));
    r.appendChild(el("div", "cell note", note));

    return r;
  }

  // Recognise common values used to mark a game as 100% complete.
  function isPerfect(value) {
    var v = String(value || "")
      .trim()
      .toLowerCase();

    return [
      "true",
      "perfect",
      "100%",
      "yes",
      "1"
    ].indexOf(v) !== -1;
  }

  function render(container, games) {
    var header = container.querySelector(".row.header");

    container.innerHTML = "";

    if (header) {
      container.appendChild(header);
    }

    var lastYear = null;

    games.forEach(function (g) {
      var newYear = g.year !== lastYear;

      if (newYear && lastYear !== null) {
        container.appendChild(
          makeRow("space", "", "", "", "")
        );
      }

      
      var notes = [];

      if (g.complete) notes.push("100%");
      if (g.notes) notes.push(g.notes);

      // Apply the "perfect" class to completed games.
      container.appendChild(
        makeRow(
          g.complete ? "perfect" : "",
          newYear ? g.year : "",
          g.game,
          g.hours ? g.hours + "h" : "",
          g.month,
          notes.join(" / ")
        )
      );

      lastYear = g.year;
    });
  }

  fetch(CSV_URL + "&t=" + Date.now())
    .then(function (r) {
      if (!r.ok) {
        throw new Error("HTTP " + r.status);
      }

      return r.text();
    })
    .then(function (text) {
      var rows = parseCSV(text);

      if (!rows.length) {
        throw new Error("The CSV is empty");
      }

      // Normalise headers to avoid issues with capitalisation or spaces.
      var head = rows.shift().map(function (h) {
        return h.replace(/^\uFEFF/, "").trim().toLowerCase();
      });

      var col = function (name) {
        return head.indexOf(name.toLowerCase());
      };

      // Check for required columns.
      ["game", "platform", "year"].forEach(function (name) {
        if (col(name) === -1) {
          throw new Error('Missing "' + name + '" column in Google Sheets');
        }
      });

      var byPlatform = {};

      rows.forEach(function (r) {
        function value(name) {
          var index = col(name);
          return index === -1 ? "" : String(r[index] || "").trim();
        }

        var game = value("game");

        if (!game) return;

        var platform = value("platform");

        (byPlatform[platform] = byPlatform[platform] || []).push({
          year: value("year"),
          month: value("month"),
          game: game,
          notes: value("notes"),
          hours: value("hours"),
          complete: isPerfect(value("perfect"))
        });
      });

      Object.keys(CONTAINERS).forEach(function (platform) {
        var container = document.getElementById(
          CONTAINERS[platform]
        );

        if (container) {
          render(container, byPlatform[platform] || []);
        }
      });
    })
    .catch(function (err) {
      console.warn("Games sheet not loaded:", err);

      Object.keys(CONTAINERS).forEach(function (platform) {
        var container = document.getElementById(
          CONTAINERS[platform]
        );

        if (!container) return;

        var msg = container.querySelector(".loading .game");

        if (msg) {
          msg.textContent = "Couldn't load the games list.";
        }
      });
    });
})();
</script>
